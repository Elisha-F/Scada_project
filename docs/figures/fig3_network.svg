<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="1442" viewBox="0 0 1344 1442" style="font-family:Inter,'DejaVu Sans',sans-serif"><rect width="1344" height="1442" fill="#fff"/><text x="43" y="60" font-size="26" font-weight="500" fill="#1d1d1b" text-anchor="start">Every critical device has two network paths</text><text x="43" y="148" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="start">IEC 60870-5-104</text><text x="43" y="177" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="start">NTP, SNMP v3</text><polyline points="311,254 311,1347 1280,1347 1280,303" fill="none" stroke="#c3c2b7" stroke-width="2"/><line x1="255" y1="254" x2="255" y2="303" stroke="#c3c2b7" stroke-width="3"/><rect x="268" y="99" width="237" height="98" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="386.5" y="140" font-size="22" font-weight="600" fill="#1d1d1b" text-anchor="middle">SCADA server A</text><text x="386.5" y="173" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="middle">Active</text><rect x="534" y="99" width="237" height="98" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="652.5" y="140" font-size="22" font-weight="600" fill="#1d1d1b" text-anchor="middle">SCADA server B</text><text x="652.5" y="173" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="middle">Hot standby</text><rect x="799" y="99" width="237" height="98" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="917.5" y="140" font-size="22" font-weight="600" fill="#1d1d1b" text-anchor="middle">Workstation</text><text x="917.5" y="173" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="middle">Operator, Admin</text><rect x="1064" y="99" width="237" height="98" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="1182.5" y="140" font-size="22" font-weight="600" fill="#1d1d1b" text-anchor="middle">Firewall</text><text x="1182.5" y="173" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="middle">VPN, default off</text><line x1="373" y1="197" x2="373" y2="254" stroke="#2a78d6" stroke-width="2.5"/><line x1="401" y1="197" x2="401" y2="303" stroke="#e8622c" stroke-width="2.5"/><line x1="639" y1="197" x2="639" y2="254" stroke="#2a78d6" stroke-width="2.5"/><line x1="667" y1="197" x2="667" y2="303" stroke="#e8622c" stroke-width="2.5"/><line x1="904" y1="197" x2="904" y2="254" stroke="#2a78d6" stroke-width="2.5"/><line x1="932" y1="197" x2="932" y2="303" stroke="#e8622c" stroke-width="2.5"/><line x1="1169" y1="197" x2="1169" y2="254" stroke="#2a78d6" stroke-width="2.5"/><line x1="1197" y1="197" x2="1197" y2="303" stroke="#e8622c" stroke-width="2.5"/><line x1="428.5" y1="254" x2="428.5" y2="360" stroke="#2a78d6" stroke-width="2.5"/><line x1="456.5" y1="303" x2="456.5" y2="360" stroke="#e8622c" stroke-width="2.5"/><line x1="713.5" y1="254" x2="713.5" y2="360" stroke="#2a78d6" stroke-width="2.5"/><line x1="741.5" y1="303" x2="741.5" y2="360" stroke="#e8622c" stroke-width="2.5"/><line x1="1036.0" y1="254" x2="1036.0" y2="360" stroke="#2a78d6" stroke-width="2.5"/><line x1="1064.0" y1="303" x2="1064.0" y2="360" stroke="#e8622c" stroke-width="2.5"/><line x1="240" y1="254" x2="1302" y2="254" stroke="#2a78d6" stroke-width="6"/><line x1="240" y1="303" x2="1302" y2="303" stroke="#e8622c" stroke-width="6"/><text x="43" y="262" font-size="19" font-weight="600" fill="#1d1d1b" text-anchor="start">Core switch A</text><text x="43" y="311" font-size="19" font-weight="600" fill="#1d1d1b" text-anchor="start">Core switch B</text><circle cx="373" cy="254" r="5.5" fill="#2a78d6"/><circle cx="401" cy="303" r="5.5" fill="#e8622c"/><circle cx="639" cy="254" r="5.5" fill="#2a78d6"/><circle cx="667" cy="303" r="5.5" fill="#e8622c"/><circle cx="904" cy="254" r="5.5" fill="#2a78d6"/><circle cx="932" cy="303" r="5.5" fill="#e8622c"/><circle cx="1169" cy="254" r="5.5" fill="#2a78d6"/><circle cx="1197" cy="303" r="5.5" fill="#e8622c"/><circle cx="428.5" cy="254" r="5.5" fill="#2a78d6"/><circle cx="456.5" cy="303" r="5.5" fill="#e8622c"/><circle cx="713.5" cy="254" r="5.5" fill="#2a78d6"/><circle cx="741.5" cy="303" r="5.5" fill="#e8622c"/><circle cx="1036.0" cy="254" r="5.5" fill="#2a78d6"/><circle cx="1064.0" cy="303" r="5.5" fill="#e8622c"/><circle cx="311" cy="254" r="5.5" fill="#2a78d6"/><circle cx="1280" cy="303" r="5.5" fill="#e8622c"/><rect x="320" y="360" width="245" height="106" rx="14" fill="#ededec" stroke="#cfcdc5" stroke-width="2"/><text x="442.5" y="401" font-size="22" font-weight="600" fill="#1d1d1b" text-anchor="middle">CP-8050 A</text><text x="442.5" y="434" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="middle">Active, dual supply</text><rect x="605" y="360" width="245" height="106" rx="14" fill="#ededec" stroke="#cfcdc5" stroke-width="2"/><text x="727.5" y="401" font-size="22" font-weight="600" fill="#1d1d1b" text-anchor="middle">CP-8050 B</text><text x="727.5" y="434" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="middle">Standby, dual supply</text><rect x="870" y="360" width="360" height="106" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="1050.0" y="401" font-size="22" font-weight="600" fill="#1d1d1b" text-anchor="middle">11 kV protection relays</text><text x="1050.0" y="434" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="middle">IEC 61850 or Modbus TCP</text><line x1="565" y1="413" x2="605" y2="413" stroke="#1d1d1b" stroke-width="2.5" stroke-dasharray="5 4"/><text x="585" y="404" font-size="14" font-weight="600" fill="#5b5b57" text-anchor="middle">sync</text><text x="333" y="502" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">Fibre ring through five switches: one break isolates nothing. Both controllers reach all six I/O rows.</text><rect x="113" y="530" width="1132" height="127" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="347" y="573" font-size="21" font-weight="600" fill="#1d1d1b" text-anchor="start">Field switch 1: inverter MV station</text><text x="347" y="606" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">PLC box for the 4 PV inverters: Modbus TCP</text><text x="347" y="634" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">Weather logger blue’Log XM: Modbus TCP</text><rect x="113" y="693" width="1132" height="127" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="347" y="736" font-size="21" font-weight="600" fill="#1d1d1b" text-anchor="start">Field switch 2: BESS yard</text><text x="347" y="769" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">Embedded EMS for battery, PV dispatch and generators: Modbus TCP</text><text x="347" y="797" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">I/O row 5 on its own fibre pair: SICAM I/O link</text><rect x="113" y="856" width="1132" height="127" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="347" y="899" font-size="21" font-weight="600" fill="#1d1d1b" text-anchor="start">Field switch 3: generator area</text><text x="347" y="932" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">Generator controllers DG1 and DG2: Modbus TCP, or RTU through a gateway</text><text x="347" y="960" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">I/O row 6 on its own fibre pair: SICAM I/O link</text><rect x="113" y="1019" width="1132" height="127" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="347" y="1062" font-size="21" font-weight="600" fill="#1d1d1b" text-anchor="start">Station switch: President office</text><text x="347" y="1095" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">RMU relay ST260E: Modbus RTU through a gateway. LVDB meter: Modbus TCP</text><text x="347" y="1123" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">I/O row 3 on its own fibre pair: SICAM I/O link</text><rect x="113" y="1182" width="1132" height="127" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="347" y="1225" font-size="21" font-weight="600" fill="#1d1d1b" text-anchor="start">Station switch: Prime Minister office</text><text x="347" y="1258" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">RMU relay ST260E: Modbus RTU through a gateway. LVDB meter: Modbus TCP</text><text x="347" y="1286" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">I/O row 4 on its own fibre pair: SICAM I/O link</text><text x="531" y="1336" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">Ring returns to core switch B</text><text x="43" y="1396" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">Each link takes the colour of the core switch it lands on. Dual links need two ports on the device.</text></svg>