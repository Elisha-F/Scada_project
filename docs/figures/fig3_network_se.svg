">VPN, default off</text><line x1="373" y1="197" x2="373" y2="254" stroke="#2a78d6" stroke-width="2.5"/><line x1="401" y1="197" x2="401" y2="303" stroke="#e8622c" stroke-width="2.5"/><line x1="639" y1="197" x2="639" y2="254" stroke="#2a78d6" stroke-width="2.5"/><line x1="667" y1="197" x2="667" y2="303" stroke="#e8622c" stroke-width="2.5"/><line x1="904" y1="197" x2="904" y2="254" stroke="#2a78d6" stroke-width="2.5"/><line x1="932" y1="197" x2="932" y2="303" stroke="#e8622c" stroke-width="2.5"/><line x1="1169" y1="197" x2="1169" y2="254" stroke="#2a78d6" stroke-width="2.5"/><line x1="1197" y1="197" x2="1197" y2="303" stroke="#e8622c" stroke-width="2.5"/><line x1="428.5" y1="254" x2="428.5" y2="360" stroke="#2a78d6" stroke-width="2.5"/><line x1="456.5" y1="303" x2="456.5" y2="360" stroke="#e8622c" stroke-width="2.5"/><line x1="713.5" y1="254" x2="713.5" y2="360" stroke="#2a78d6" stroke-width="2.5"/><line x1="741.5" y1="303" x2="741.5" y2="360" stroke="#e8622c" stroke-width="2.5"/><line x1="1036.0" y1="254" x2="1036.0" y2="360" stroke="#2a78d6" stroke-width="2.5"/><line x1="1064.0" y1="303" x2="1064.0" y2="360" stroke="#e8622c" stroke-width="2.5"/><line x1="240" y1="254" x2="1302" y2="254" stroke="#2a78d6" stroke-width="6"/><line x1="240" y1="303" x2="1302" y2="303" stroke="#e8622c" stroke-width="6"/><text x="43" y="262" font-size="19" font-weight="600" fill="#1d1d1b" text-anchor="start">Core switch A</text><text x="43" y="311" font-size="19" font-weight="600" fill="#1d1d1b" text-anchor="start">Core switch B</text><circle cx="373" cy="254" r="5.5" fill="#2a78d6"/><circle cx="401" cy="303" r="5.5" fill="#e8622c"/><circle cx="639" cy="254" r="5.5" fill="#2a78d6"/><circle cx="667" cy="303" r="5.5" fill="#e8622c"/><circle cx="904" cy="254" r="5.5" fill="#2a78d6"/><circle cx="932" cy="303" r="5.5" fill="#e8622c"/><circle cx="1169" cy="254" r="5.5" fill="#2a78d6"/><circle cx="1197" cy="303" r="5.5" fill="#e8622c"/><circle cx="428.5" cy="254" r="5.5" fill="#2a78d6"/><circle cx="456.5" cy="303" r="5.5" fill="#e8622c"/><circle cx="713.5" cy="254" r="5.5" fill="#2a78d6"/><circle cx="741.5" cy="303" r="5.5" fill="#e8622c"/><circle cx="1036.0" cy="254" r="5.5" fill="#2a78d6"/><circle cx="1064.0" cy="303" r="5.5" fill="#e8622c"/><circle cx="311" cy="254" r="5.5" fill="#2a78d6"/><circle cx="1280" cy="303" r="5.5" fill="#e8622c"/><rect x="320" y="360" width="245" height="106" rx="14" fill="#ededec" stroke="#cfcdc5" stroke-width="2"/><text x="442.5" y="401" font-size="22" font-weight="600" fill="#1d1d1b" text-anchor="middle">M580 A</text><text x="442.5" y="434" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="middle">Active, dual supply</text><rect x="605" y="360" width="245" height="106" rx="14" fill="#ededec" stroke="#cfcdc5" stroke-width="2"/><text x="727.5" y="401" font-size="22" font-weight="600" fill="#1d1d1b" text-anchor="middle">M580 B</text><text x="727.5" y="434" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="middle">Standby, dual supply</text><rect x="870" y="360" width="360" height="106" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="1050.0" y="401" font-size="22" font-weight="600" fill="#1d1d1b" text-anchor="middle">11 kV protection relays</text><text x="1050.0" y="434" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="middle">Modbus TCP</text><line x1="565" y1="413" x2="605" y2="413" stroke="#1d1d1b" stroke-width="2.5" stroke-dasharray="5 4"/><text x="585" y="404" font-size="14" font-weight="600" fill="#5b5b57" text-anchor="middle">HSBY</text><text x="333" y="494" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">Switchroom I/O drop on the M580 remote I/O network, in the SCADA cabinet.</text><text x="333" y="517" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">Fibre ring through five switches: one break isolates nothing.</text><rect x="113" y="545" width="1132" height="124" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="347" y="587" font-size="21" font-weight="600" fill="#1d1d1b" text-anchor="start">Field switch 1: inverter MV station</text><text x="347" y="619" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">PLC box for the 4 PV inverters: Modbus TCP</text><text x="347" y="647" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">Weather logger blue’Log XM: Modbus TCP</text><rect x="113" y="705" width="1132" height="124" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="347" y="747" font-size="21" font-weight="600" fill="#1d1d1b" text-anchor="start">Field switch 2: BESS yard</text><text x="347" y="779" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">Embedded EMS for battery, PV dispatch and generators: Modbus TCP</text><text x="347" y="807" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">Edge I/O island, BESS yard: EtherNet/IP</text><rect x="113" y="865" width="1132" height="124" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="347" y="907" font-size="21" font-weight="600" fill="#1d1d1b" text-anchor="start">Field switch 3: generator area</text><text x="347" y="939" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">Generator controllers DG1 and DG2: Modbus TCP, or RTU through the island serial master</text><text x="347" y="967" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">Edge I/O island, generator area: EtherNet/IP</text><rect x="113" y="1025" width="1132" height="124" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="347" y="1067" font-size="21" font-weight="600" fill="#1d1d1b" text-anchor="start">Station switch: President office</text><text x="347" y="1099" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">RMU relay ST260E: Modbus RTU through the island serial master. LVDB meter: Modbus TCP</text><text x="347" y="1127" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">Edge I/O island, President station: EtherNet/IP</text><rect x="113" y="1185" width="1132" height="124" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="347" y="1227" font-size="21" font-weight="600" fill="#1d1d1b" text-anchor="start">Station switch: Prime Minister office</text><text x="347" y="1259" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">RMU relay ST260E: Modbus RTU through the island serial master. LVDB meter: Modbus TCP</text><text x="347" y="1287" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">Edge I/O island, PM station: EtherNet/IP</text><text x="531" y="1336" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">Ring returns to core switch B</text><text x="43" y="1396" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">Each link takes the colour of the core switch it lands on. Dual links need two ports on the device.</text></svg>