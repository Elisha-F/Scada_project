<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="1233" viewBox="0 0 1344 1233" style="font-family:Inter,'DejaVu Sans',sans-serif"><rect width="1344" height="1233" fill="#fff"/><text x="43" y="60" font-size="26" font-weight="500" fill="#1d1d1b" text-anchor="start">Two M580 controllers in hot standby gather the whole plant for the SCADA</text><rect x="42" y="99" width="573" height="106" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="328.5" y="146.0" font-size="22" font-weight="600" fill="#1d1d1b" text-anchor="middle">SCADA stations A and B</text><text x="328.5" y="179.0" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="middle">Machine SCADA Expert, Operator and Admin logins</text><rect x="728" y="99" width="573" height="106" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="1014.5" y="146.0" font-size="22" font-weight="600" fill="#1d1d1b" text-anchor="middle">Firewall and GPS time server</text><text x="1014.5" y="179.0" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="middle">VPN remote support, off by default</text><line x1="329" y1="213" x2="329" y2="260" stroke="#c3c2b7" stroke-width="2"/><path d="M323,258 L329,268 L335,258" fill="none" stroke="#c3c2b7" stroke-width="2"/><path d="M323,215 L329,205 L335,215" fill="none" stroke="#c3c2b7" stroke-width="2"/><text x="350" y="243" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="start">Modbus TCP to both controllers</text><line x1="1015" y1="213" x2="1015" y2="260" stroke="#c3c2b7" stroke-width="2"/><path d="M1009,258 L1015,268 L1021,258" fill="none" stroke="#c3c2b7" stroke-width="2"/><text x="1036" y="243" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="start">Time sync and VPN</text><rect x="42" y="268" width="1260" height="150" rx="14" fill="#e5effa" stroke="#2a78d6" stroke-width="3"/><text x="672" y="302" font-size="24" font-weight="600" fill="#1d1d1b" text-anchor="middle">Schneider Electric Modicon M580 plant controllers, hot standby pair</text><rect x="70" y="320" width="520" height="82" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="330.0" y="352" font-size="21" font-weight="600" fill="#1d1d1b" text-anchor="middle">Controller A · active</text><text x="330.0" y="385" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="middle">Collects every signal, switches breakers</text><rect x="754" y="320" width="520" height="82" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="1014.0" y="352" font-size="21" font-weight="600" fill="#1d1d1b" text-anchor="middle">Controller B · hot standby</text><text x="1014.0" y="385" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="middle">Follows A and takes over if A fails</text><line x1="598" y1="361" x2="746" y2="361" stroke="#2a78d6" stroke-width="2.5" stroke-dasharray="7 5"/><text x="672" y="351" font-size="16" font-weight="500" fill="#2a78d6" text-anchor="middle">hot standby link</text><line x1="350" y1="426" x2="350" y2="473" stroke="#c3c2b7" stroke-width="2"/><path d="M344,471 L350,481 L356,471" fill="none" stroke="#c3c2b7" stroke-width="2"/><path d="M344,428 L350,418 L356,428" fill="none" stroke="#c3c2b7" stroke-width="2"/><text x="372" y="452" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="start">Modbus TCP</text><line x1="993" y1="426" x2="993" y2="473" stroke="#c3c2b7" stroke-width="2"/><path d="M987,471 L993,481 L999,471" fill="none" stroke="#c3c2b7" stroke-width="2"/><path d="M987,428 L993,418 L999,428" fill="none" stroke="#c3c2b7" stroke-width="2"/><text x="1015" y="452" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="start">Remote I/O and EtherNet/IP</text><rect x="42" y="481" width="615" height="650" rx="14" fill="#ededec" stroke="#cfcdc5" stroke-width="2"/><text x="71" y="519" font-size="19" font-weight="600" fill="#1d1d1b" text-anchor="start">Read over the network</text><rect x="686" y="481" width="615" height="650" rx="14" fill="#ededec" stroke="#cfcdc5" stroke-width="2"/><text x="715" y="519" font-size="19" font-weight="600" fill="#1d1d1b" text-anchor="start">Hardwired at five I/O locations</text><rect x="70" y="538" width="559" height="99" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="349.5" y="581.5" font-size="22" font-weight="600" fill="#1d1d1b" text-anchor="middle">Embedded EMS</text><text x="349.5" y="614.5" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="middle">Battery, generators and dispatch</text><rect x="70" y="655" width="559" height="99" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="349.5" y="698.5" font-size="22" font-weight="600" fill="#1d1d1b" text-anchor="middle">PLC box</text><text x="349.5" y="731.5" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="middle">Four PV inverters, Modbus TCP</text><rect x="70" y="772" width="559" height="99" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="349.5" y="815.5" font-size="22" font-weight="600" fill="#1d1d1b" text-anchor="middle">11 kV and RMU relays</text><text x="349.5" y="848.5" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="middle">Modbus TCP; ST260E on Modbus RTU</text><rect x="70" y="889" width="559" height="99" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="349.5" y="932.5" font-size="22" font-weight="600" fill="#1d1d1b" text-anchor="middle">Power meters and UPS</text><text x="349.5" y="965.5" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="middle">Modbus TCP or SNMP</text><rect x="70" y="1006" width="559" height="99" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="349.5" y="1049.5" font-size="22" font-weight="600" fill="#1d1d1b" text-anchor="middle">Weather station logger</text><text x="349.5" y="1082.5" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="middle">Modbus TCP</text><rect x="714" y="538" width="559" height="99" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="993.5" y="581.5" font-size="22" font-weight="600" fill="#1d1d1b" text-anchor="middle">Switchroom remote drop, 6 modules</text><text x="993.5" y="614.5" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="middle">11 kV panels, breaker commands, auxiliaries</text><rect x="714" y="655" width="559" height="99" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="993.5" y="698.5" font-size="22" font-weight="600" fill="#1d1d1b" text-anchor="middle">President station island, 4 modules</text><text x="993.5" y="731.5" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="middle">RMU, transformer and LVDB, over fibre</text><rect x="714" y="772" width="559" height="99" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="993.5" y="815.5" font-size="22" font-weight="600" fill="#1d1d1b" text-anchor="middle">Prime Minister station island, 4 modules</text><text x="993.5" y="848.5" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="middle">RMU, transformer and LVDB, over fibre</text><rect x="714" y="889" width="559" height="99" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="993.5" y="932.5" font-size="22" font-weight="600" fill="#1d1d1b" text-anchor="middle">BESS yard island, 2 modules</text><text x="993.5" y="965.5" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="middle">Inverter transformer, fire panel, over fibre</text><rect x="714" y="1006" width="559" height="99" rx="14" fill="#fff" stroke="#cfcdc5" stroke-width="2"/><text x="993.5" y="1049.5" font-size="22" font-weight="600" fill="#1d1d1b" text-anchor="middle">Generator area island, 3 modules</text><text x="993.5" y="1082.5" font-size="19" font-weight="400" fill="#5b5b57" text-anchor="middle">Generator status, fuel, transformer, fibre</text><text x="43" y="1175" font-size="18" font-weight="400" fill="#5b5b57" text-anchor="start">Each I/O location is reached by both controllers. The EMS keeps dispatch of PV, battery and generators. Protection trips stay in the relays.</text></svg>